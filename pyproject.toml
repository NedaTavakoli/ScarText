[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scartext"
version = "0.1.0"
description = "Classify myocardial scar patterns from free-text cardiac MRI reports with expert rules and local open-weight LLMs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["pandas>=2.1", "numpy>=1.26", "scikit-learn>=1.3", "scipy>=1.11"]

[tool.setuptools]
packages = ["scartext"]
